name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: digest_test
          POSTGRES_USER: digest_test
          POSTGRES_PASSWORD: integration-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U digest_test" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: digest_test
      POSTGRES_USER: digest_test
      POSTGRES_PASSWORD: integration-test-only
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check src tests manage.py
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f compose.production.yaml config --quiet
      - run: docker build -t ai-digest:test .
