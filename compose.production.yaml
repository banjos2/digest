name: ai-digest

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-digest:${APP_IMAGE_TAG:-local}
  # .env.production on a manual Debian install, .env when Dokploy writes the variables.
  env_file:
    - path: .env.production
      required: false
    - path: .env
      required: false
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - telethon_session:/run/secrets/telethon
    - ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH}:/backups
    - ${ERASURE_GUARD_HOST_PATH:?Set ERASURE_GUARD_HOST_PATH}:/erasure-guard

x-app-dependencies: &app-dependencies
  db:
    condition: service_healthy
  broker:
    condition: service_healthy
  init-app:
    condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  broker:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  init-app:
    <<: *app-base
    restart: "no"
    command: ["sh", "/app/deploy/init.sh"]
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - telethon_session:/run/secrets/telethon
      - ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH}:/backups
      - ${ERASURE_GUARD_HOST_PATH:?Set ERASURE_GUARD_HOST_PATH}:/erasure-guard

  web:
    <<: *app-base
    command:
      - gunicorn
      - digest_service.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "90"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on: *app-dependencies
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Django answers 400 to hosts outside DJANGO_ALLOWED_HOSTS, so send the first allowed one.
        - "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':host, 'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  proxy:
    image: nginx:stable-bookworm
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
    security_opt:
      - no-new-privileges:true

  worker:
    <<: *app-base
    command:
      - celery
      - -A
      - digest_service.celery_app
      - worker
      - -Q
      - maintenance
      - --loglevel=INFO
      - --concurrency=1
      - --hostname=worker@%h
    depends_on: *app-dependencies
    stop_grace_period: 35m
    healthcheck:
      test: ["CMD-SHELL", "celery -A digest_service.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  scheduler:
    <<: *app-base
    command: ["python", "manage.py", "run_background_scheduler", "--poll-seconds", "15"]
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_process_lease", "background_scheduler"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  telegram-receiver:
    <<: *app-base
    command:
      - python
      - manage.py
      - run_telegram_polling
      - --timeout
      - "30"
      - --receive-only
      - --delete-webhook
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_process_lease", "telegram_receiver"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  telegram-sender:
    <<: *app-base
    command:
      - python
      - manage.py
      - run_telegram_sender
      - --poll-seconds
      - "2"
      - --batch-size
      - "25"
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_process_lease", "telegram_sender"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  app-admin:
    <<: *app-base
    profiles: ["tools"]
    restart: "no"
    command: ["python", "manage.py", "check"]
    depends_on: *app-dependencies
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  rabbitmq_data:
  static_files:
  telethon_session:
