[project]
name = "owned-ai-digest"
version = "0.1.0"
description = "Owned Telegram digest service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.6,<5.7",
  "aiogram>=3,<4",
  "aiohttp>=3.14,<3.15",
  "feedparser>=6.0.14,<7",
  "trafilatura>=2.2,<3",
  "openai>=2,<3",
  "Telethon>=1.44,<2",
  "pgvector>=0.4,<0.5",
  "gunicorn>=23,<24",
  "tzdata",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["research", "tmp", "var", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
